[package]
name = "vilink-calculadora"
version = "1.0.0"
description = "ViLink Calculadora - Armado de pantallas LED"
authors = ["ViLink"]
edition = "2021"

[lib]
name = "vilink_calculadora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
